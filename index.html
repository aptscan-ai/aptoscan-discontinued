    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 20vh 16px 40px;
        background: #0e0f12;
        color: #f5f6f7;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          'Helvetica Neue', Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .card {
        width: 100%;
        max-width: 650px;
        padding: 44px 40px 48px;
        border: 1px solid #23262d;
        border-radius: 16px;
        background: #14171d;
        text-align: center;
      }

      .brand {
        margin-bottom: 36px;
      }

      .brand svg {
        display: block;
        width: 240px;
        max-width: 100%;
        height: auto;
        margin: 0 auto;
      }

      .icon {
        width: 74px;
        height: 74px;
        margin: 0 auto 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: #3a2a1c;
        color: #f28b2b;
      }

      .icon svg {
        width: 38px;
        height: 38px;
      }

      h1 {
        margin: 0 0 28px;
        font-size: 28px;
        font-weight: 700;
        line-height: 1.2;
      }

      p {
        margin: 0 0 22px;
        font-size: 17px;
        line-height: 1.5;
        color: #9ca1ab;
      }

      p strong {
        color: #ffffff;
        font-weight: 600;
      }

      .copyright {
        margin: 38px 0 0;
        font-size: 15px;
        color: #8a8f99;
      }

      @media (max-width: 480px) {
        .card {
          padding: 32px 20px 36px;
        }

        .brand svg {
          width: 200px;
        }

        h1 {
          font-size: 24px;
        }

        p {
          font-size: 15px;
        }
      }
    </style>
